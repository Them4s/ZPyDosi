stages: [lint, test, build]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"

cache:
  paths:
    - .cache/pip

.default_job:
  before_script:
    - python -V
    - python -m pip install --upgrade pip

lint:
  stage: lint
  image: python:3.14
  extends: .default_job
  script:
    - pip install ruff
    - ruff check .

test:py39:
  stage: test
  image: python:3.9
  extends: .default_job
  script:
    - pip install -e .
    - pip install pytest
    - pytest -q --junitxml=junit.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml

