[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "ZPyDosi"
version = "0.0.1"
authors = [
  { name="Thomas Ligonnet", email="thomas.ligonnet@proton.me" },
]
description = "Dosimety functions package"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "openpyxl",
    "matplotlib",
    "scipy",
    "pandas",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://gitlab.epfl.ch/zero-power-dosimetry/zpydosi"
Issues = "https://gitlab.epfl.ch/zero-power-dosimetry/zpydosi/issues"

[tool.ruff]
exclude = ["Scripts"]
[tool.ruff.lint]
ignore = ["E701","E741","E402","E721","F841","F601","E712","E401","E711","E722","I001"] # not good, ti modify someday
extend-select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
]